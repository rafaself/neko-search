name: Validate Local Inference

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inference:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 25.9.0, 'lts/*', current]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Build and install the pinned runtime and model
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/nekosearch-data
          NEKOSEARCH_MODEL_DIR: ${{ runner.temp }}/nekosearch-model
        run: |
          npm run build
          node apps/nekosearch/dist/apps/nekosearch/cli.js model install
          node apps/nekosearch/dist/apps/nekosearch/cli.js model status | tee "$RUNNER_TEMP/nekosearch-model-status"
          grep -F 'Available for inference: yes' "$RUNNER_TEMP/nekosearch-model-status"

      - name: Run real offline Qwen3 inference
        run: npm test -- --runTestsByPath test/integration/apps/nekosearch/local-qwen3-inference.integration.spec.ts
        env:
          NEKOSEARCH_RUN_QWEN3_INTEGRATION: '1'
          XDG_DATA_HOME: ${{ runner.temp }}/nekosearch-data
          NEKOSEARCH_MODEL_DIR: ${{ runner.temp }}/nekosearch-model
