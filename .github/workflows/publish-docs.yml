name: Publish documentation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCS_SITE_BASE: /
      DOCS_SITE_URL: https://nekosearch.github.io
    steps:
      - name: Check publishing repository
        shell: bash
        run: |
          if [[ "$GITHUB_REPOSITORY" != "nekosearch/nekosearch.github.io" ]]; then
            echo "::error::Publish this workflow from nekosearch/nekosearch.github.io to deploy to https://nekosearch.github.io/."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build documentation site
        run: npm run docs:site:build

      - name: Check generated documentation site
        run: npm run docs:site:check

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs-site/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
