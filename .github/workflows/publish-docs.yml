name: Publish documentation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOCS_SITE_BASE: /
      DOCS_SITE_URL: https://nekosearch.pages.dev
    steps:
      - name: Require the production branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "::error::Run this workflow from the main branch to publish https://nekosearch.pages.dev/."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build documentation site
        run: npm run docs:site:build

      - name: Check generated documentation site
        run: npm run docs:site:check

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy apps/docs-site/.vitepress/dist --project-name=nekosearch --branch=main

      - name: Add deployment URL to the run summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: echo "Documentation deployed to ${DEPLOYMENT_URL}" >> "$GITHUB_STEP_SUMMARY"
